# Локальный запуск: PostgreSQL и приложение из Dockerfile, как его запускает проверка.
# make compose-up → http://localhost:8080
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-appdb}"]
      interval: 2s
      timeout: 2s
      retries: 30

  app:
    build: .
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-appdb}
      MONITORING_DSN: ${MONITORING_DSN:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
